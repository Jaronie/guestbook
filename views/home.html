<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guestbook Form</title>
  <!-- css file -->
  <link rel="stylesheet" href="/styles/styles.css">
  <!-- script -->
  <script src="/js/app.js" defer></script>
  <!-- favicon -->
  <link rel="icon" type="image/x-icon" href="/images/me.jpg">
</head>

<body>
  <main>

    <header>
      <h1>Contact Form</h1>
    </header>
    <form id="guest-form">
      <div id="labels"></div>
      <label for="fname">
        First Name:
        <input type="text" id="fname" name="fname">
      </label>
      <label for="lname">
        Last Name:
        <input type="text" id="lname" name="lname">
      </label>
      <label for="Company">
        Company:
        <input type="text" id="Company" name="company">
      </label>
      <label for="linkedin">
        LinkedIn URL:
        <input type="text" id="linkedin" name="linkedin">
      </label>
      <label for="email">
        Email:
        <input type="text" id="email" name="email">
      </label>
      <select name="cars" id="cars">
                <label for="cars">How did we meet?</label>
<option value="none">Please select</option>
<option value="placeholder">Placeholder</option>

</select>
      <label for="other">
        Other (please specify):
        <input type="text" id="other" name="other">
      </label>
      <label for="message">
        Message:
        <textarea id="message" name="message" rows="4" cols="50"></textarea>
        <input type="checkbox" id="mailing-list" name="mailing-list" value="yes">
        <label for="mailing-list">Add me to your mailing list</label>
        <input type="radio" id="form-type"
        name="form-type"
        value="html">
        <label for="form-type">HTML</label>
        <input type="radio" id="form-type"
        name="form-type"
        value="text">
        <label for="form-type">Text</label>
    </form>
    <button id="submitBtn">Submit</button>
  </main>


</body>

</html>
